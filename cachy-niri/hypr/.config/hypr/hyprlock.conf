# hyprlock — colors from the DMS/matugen palette (dms-colors.json, dark)
$wall    = /home/anakafeel/Pictures/Wallpapers/a2c9d106abd54d5764773a2174f4becb (1).jpg
$font    = JetBrainsMono Nerd Font
$primary = rgb(89d0ee)
$text    = rgb(dee3e6)
$muted   = rgb(c0c8cc)
$surface = rgba(0f1417cc)
$error   = rgb(ffb4ab)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = $wall
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# Day
label {
    monitor =
    text = cmd[update:60000] date +"%A"
    color = $primary
    font_size = 28
    font_family = $font ExtraLight
    position = 0, 260
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 132
    font_family = $font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%d %B"
    color = $muted
    font_size = 20
    font_family = $font Light
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $text
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <span foreground="##c0c8cc">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -110
    halign = center
    valign = center
}

# Now playing (empty when nothing plays)
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '󰎆  {{artist}} — {{title}}' 2>/dev/null | cut -c1-60
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
