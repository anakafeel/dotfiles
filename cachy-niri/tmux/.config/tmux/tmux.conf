# tmux config - keybinds mirror niri, with Alt standing in for Super.
#
#   niri (Super)                  tmux (Alt, no prefix needed)
#   Mod+Enter  terminal           Alt+Enter        split right   (Alt+Shift+Enter: split down)
#   Mod+T      terminal           Alt+T            new window
#   Mod+Q      close              Alt+Q            close pane
#   Mod+HJKL / arrows  focus      Alt+HJKL / arrows  focus pane (passes through to nvim splits)
#   Mod+W / Mod+S      focus up/dn Alt+W / Alt+S     focus pane up / down (same passthrough)
#   Mod+Ctrl+HJKL      move       Alt+Ctrl+HJKL / arrows  swap pane in that direction
#   Mod+1..9   workspace          Alt+1..9         window 1..9
#   Mod+Shift+1..9  send to ws    Alt+Shift+1..9   send pane to window 1..9
#   Mod+U / Mod+I   ws down/up    Alt+U / Alt+I    next / previous window
#   Mod+Shift+U/I   move ws       Alt+Shift+U/I    move window right / left
#   Mod+F      maximize           Alt+F            zoom pane
#   Mod+R      preset widths      Alt+R            cycle layouts
#   Mod+Minus/Equal  width        Alt+Minus/Equal  pane width -/+   (add Shift for height)
#   Mod+O      overview           Alt+O            session/window tree
#   Mod+V      clipboard          Alt+V            copy mode (v select, y copy, q quit)
#
# Prefix is Ctrl+Space for everything else. Prefix + I installs plugins,
# prefix + r reloads this file, prefix + ? lists every bind.

# --- General ---
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0              # no lag on Esc in nvim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,*256col*:RGB"
set -s set-clipboard on
setw -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Panes and windows (Alt = niri's Mod) ---
bind -n M-Enter   split-window -h -c "#{pane_current_path}"
bind -n M-S-Enter split-window -v -c "#{pane_current_path}"
bind -n M-t       new-window -c "#{pane_current_path}"
bind -n M-q       kill-pane

# Focus: if the pane runs nvim, hand the key to nvim so it can move between
# its own splits first (vim-tmux-navigator on the nvim side).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n M-h     if-shell "$is_vim" "send-keys M-h"     "select-pane -L"
bind -n M-j     if-shell "$is_vim" "send-keys M-j"     "select-pane -D"
bind -n M-k     if-shell "$is_vim" "send-keys M-k"     "select-pane -U"
bind -n M-l     if-shell "$is_vim" "send-keys M-l"     "select-pane -R"
bind -n M-w     if-shell "$is_vim" "send-keys M-w"     "select-pane -U"
bind -n M-s     if-shell "$is_vim" "send-keys M-s"     "select-pane -D"
bind -n M-Left  if-shell "$is_vim" "send-keys M-Left"  "select-pane -L"
bind -n M-Down  if-shell "$is_vim" "send-keys M-Down"  "select-pane -D"
bind -n M-Up    if-shell "$is_vim" "send-keys M-Up"    "select-pane -U"
bind -n M-Right if-shell "$is_vim" "send-keys M-Right" "select-pane -R"

# Move: swap with the neighbouring pane, focus follows
bind -n M-C-h     swap-pane -d -t "{left-of}"
bind -n M-C-j     swap-pane -d -t "{down-of}"
bind -n M-C-k     swap-pane -d -t "{up-of}"
bind -n M-C-l     swap-pane -d -t "{right-of}"
bind -n M-C-Left  swap-pane -d -t "{left-of}"
bind -n M-C-Down  swap-pane -d -t "{down-of}"
bind -n M-C-Up    swap-pane -d -t "{up-of}"
bind -n M-C-Right swap-pane -d -t "{right-of}"

# Windows are tmux's workspaces
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Send pane to window N (creating it if needed). Alt+Shift+digit arrives as the shifted symbol.
bind -n 'M-!' if-shell "tmux list-windows -F '##I' | grep -qx 1" "join-pane -t :1" "break-pane -t :1"
bind -n 'M-@' if-shell "tmux list-windows -F '##I' | grep -qx 2" "join-pane -t :2" "break-pane -t :2"
bind -n 'M-#' if-shell "tmux list-windows -F '##I' | grep -qx 3" "join-pane -t :3" "break-pane -t :3"
bind -n 'M-$' if-shell "tmux list-windows -F '##I' | grep -qx 4" "join-pane -t :4" "break-pane -t :4"
bind -n 'M-%' if-shell "tmux list-windows -F '##I' | grep -qx 5" "join-pane -t :5" "break-pane -t :5"
bind -n 'M-^' if-shell "tmux list-windows -F '##I' | grep -qx 6" "join-pane -t :6" "break-pane -t :6"
bind -n 'M-&' if-shell "tmux list-windows -F '##I' | grep -qx 7" "join-pane -t :7" "break-pane -t :7"
bind -n 'M-*' if-shell "tmux list-windows -F '##I' | grep -qx 8" "join-pane -t :8" "break-pane -t :8"
bind -n 'M-(' if-shell "tmux list-windows -F '##I' | grep -qx 9" "join-pane -t :9" "break-pane -t :9"

bind -n M-u next-window
bind -n M-i previous-window
bind -n M-U swap-window -d -t +1
bind -n M-I swap-window -d -t -1

# Sizing & layout
bind -n M-f     resize-pane -Z
bind -n M-r     next-layout
bind -n M--     resize-pane -L 5
bind -n M-=     resize-pane -R 5
bind -n M-_     resize-pane -D 3
bind -n M-+     resize-pane -U 3

# Overview & copy
bind -n M-o choose-tree -Zs
bind -n M-v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Prefix fallbacks with familiar split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Look (matches the DMS blue) ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#8a9296"
set -g status-left "#[fg=#0b1d24,bg=#89d0ee,bold] #S #[bg=default] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#ffb4ab]PREFIX ,}#[fg=#8a9296]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#89d0ee,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#3a4246"
set -g pane-active-border-style "fg=#89d0ee"
set -g message-style "bg=#89d0ee,fg=#0b1d24"
set -g mode-style "bg=#89d0ee,fg=#0b1d24"

# --- Plugins (prefix + I to install) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-saves every 15 min
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Fresh machine: fetch TPM and install the plugins above on first start.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
